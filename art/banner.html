<!doctype html>
<!-- Source for the Android TV banner, screensaver preview and README art.
     Regenerate with: node art/render.js -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 320px; height: 180px; overflow: hidden; background: #0b0d12; }
  svg { display: block; }
  /* Archivo is bundled with the app (res/font, OFL licence in licenses/). */
  @font-face { font-family: Archivo; font-weight: 900; src: url('../app/src/main/res/font/archivo_black.ttf'); }
  @font-face { font-family: Archivo; font-weight: 800; src: url('../app/src/main/res/font/archivo_extrabold.ttf'); }
  .name { font: 900 19px/1 Archivo, sans-serif; letter-spacing: -0.4px; fill: #111111; }
  .tag { font: 800 8.5px/1 Archivo, sans-serif; letter-spacing: 0.9px; fill: #111111; }
</style>
</head>
<body>
<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Four slanted strips, one per season. -->
    <clipPath id="c-spring"><polygon points="0,0 98,0 74,180 0,180"/></clipPath>
    <clipPath id="c-summer"><polygon points="98,0 178,0 154,180 74,180"/></clipPath>
    <clipPath id="c-autumn"><polygon points="178,0 258,0 234,180 154,180"/></clipPath>
    <clipPath id="c-winter"><polygon points="258,0 320,0 320,180 234,180"/></clipPath>

    <linearGradient id="sky-spring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc3ea"/><stop offset="1" stop-color="#e3f4dc"/></linearGradient>
    <linearGradient id="sky-summer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.65" stop-color="#ffd98a"/><stop offset="1" stop-color="#ffe9b8"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9fd0"/><stop offset="1" stop-color="#16628f"/></linearGradient>
    <linearGradient id="sky-autumn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7744a"/><stop offset="1" stop-color="#f7c58c"/></linearGradient>
    <linearGradient id="sky-winter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb7e6"/><stop offset="1" stop-color="#e3efff"/></linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Spring: blossom tree on green hills -->
  <g clip-path="url(#c-spring)"><g transform="translate(0 -26)">
    <rect width="110" height="210" fill="url(#sky-spring)"/>
    <path d="M-10,128 Q30,104 70,122 T120,118 V210 H-10 Z" fill="#8fd17c"/>
    <path d="M-10,150 Q40,128 110,146 V210 H-10 Z" fill="#5fae5a"/>
    <rect x="54" y="96" width="4" height="34" rx="2" fill="#6b4a3a"/>
    <g fill="#f7a8c4"><circle cx="56" cy="90" r="15"/><circle cx="44" cy="98" r="10"/><circle cx="68" cy="98" r="10"/></g>
    <g fill="#fbd3e2"><circle cx="50" cy="86" r="5"/><circle cx="63" cy="92" r="4"/><circle cx="46" cy="100" r="3"/></g>
    <g fill="#ffffff" opacity="0.9"><circle cx="24" cy="138" r="1.6"/><circle cx="34" cy="146" r="1.4"/><circle cx="80" cy="140" r="1.5"/></g></g>
  </g>

  <!-- Summer: sun over the sea -->
  <g clip-path="url(#c-summer)"><g transform="translate(0 -26)">
    <rect x="70" width="112" height="210" fill="url(#sky-summer)"/>
    <circle cx="132" cy="70" r="20" fill="#fff4cf"/>
    <circle cx="132" cy="70" r="28" fill="#fff4cf" opacity="0.25"/>
    <rect x="70" y="112" width="112" height="40" fill="url(#sea)"/>
    <g stroke="#d6f2ff" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <line x1="112" y1="120" x2="124" y2="120"/><line x1="134" y1="126" x2="150" y2="126"/><line x1="100" y1="134" x2="110" y2="134"/>
    </g>
    <path d="M70,150 Q120,140 182,152 V210 H70 Z" fill="#f2d39b"/></g>
  </g>

  <!-- Autumn: orange trees and falling leaves -->
  <g clip-path="url(#c-autumn)"><g transform="translate(0 -26)">
    <rect x="150" width="112" height="210" fill="url(#sky-autumn)"/>
    <path d="M150,132 Q200,112 262,130 V210 H150 Z" fill="#9a4e2c"/>
    <path d="M150,154 Q210,138 262,152 V210 H150 Z" fill="#6e3520"/>
    <rect x="196" y="100" width="4" height="34" rx="2" fill="#4a2a1c"/>
    <circle cx="198" cy="94" r="17" fill="#f08a4b"/>
    <circle cx="188" cy="102" r="10" fill="#d9622f"/>
    <rect x="228" y="110" width="3" height="26" rx="1.5" fill="#4a2a1c"/>
    <circle cx="229.5" cy="106" r="11" fill="#ffb347"/>
    <g fill="#ffcf6b"><ellipse cx="214" cy="70" rx="2.6" ry="1.5" transform="rotate(30 214 70)"/><ellipse cx="176" cy="60" rx="2.6" ry="1.5" transform="rotate(-20 176 60)"/><ellipse cx="238" cy="84" rx="2.4" ry="1.4" transform="rotate(50 238 84)"/></g></g>
  </g>

  <!-- Winter: snowy peaks and pines -->
  <g clip-path="url(#c-winter)"><g transform="translate(0 -26)">
    <rect x="230" width="92" height="210" fill="url(#sky-winter)"/>
    <path d="M230,140 L262,82 L286,118 L304,96 L330,140 Z" fill="#5d7fa6"/>
    <path d="M262,82 L272,100 L264,96 L256,104 L252,100 Z" fill="#ffffff"/>
    <path d="M304,96 L312,108 L305,106 L299,112 L296,108 Z" fill="#ffffff"/>
    <path d="M230,148 Q275,132 330,146 V210 H230 Z" fill="#f4f8ff"/>
    <g fill="#2d4a5e"><path d="M270,150 l8,-22 l8,22 Z"/><path d="M286,154 l7,-18 l7,18 Z"/></g>
    <g fill="#ffffff"><circle cx="246" cy="40" r="1.4"/><circle cx="280" cy="30" r="1.2"/><circle cx="300" cy="56" r="1.4"/><circle cx="262" cy="62" r="1"/><circle cx="312" cy="22" r="1.1"/></g></g>
  </g>

  <!-- Thick black seams between seasons (brutalist outlines) -->
  <g stroke="#111111" stroke-width="3.5">
    <line x1="98" y1="0" x2="74" y2="180"/><line x1="178" y1="0" x2="154" y2="180"/><line x1="258" y1="0" x2="234" y2="180"/>
  </g>
  <rect width="320" height="180" fill="url(#vignette)"/>
  <rect x="1.5" y="1.5" width="317" height="177" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Tag, top left -->
  <g transform="translate(16 15)">
    <rect x="2.5" y="2.5" width="152" height="20" rx="2" fill="#111111"/>
    <rect width="152" height="20" rx="2" fill="#FF5A1F" stroke="#111111" stroke-width="2"/>
    <text class="tag" x="76" y="13.6" text-anchor="middle">SEASONAL SCREENSAVER</text>
  </g>

  <!-- Title block: cream card, black outline, hard shadow -->
  <g transform="translate(16 113)">
    <rect x="4" y="4" width="206" height="50" rx="3" fill="#111111"/>
    <rect width="206" height="50" rx="3" fill="#FFF7EA" stroke="#111111" stroke-width="2.5"/>
    <!-- Logo tile (same geometry as res/drawable/ic_logo.xml) -->
    <g transform="translate(3 2) scale(0.98)">
      <path d="M17,11 H35 A6,6 0 0 1 41,17 V35 A6,6 0 0 1 35,41 H17 A6,6 0 0 1 11,35 V17 A6,6 0 0 1 17,11 Z" fill="#FF5A1F"/>
      <path d="M14,8 H32 A6,6 0 0 1 38,14 V32 A6,6 0 0 1 32,38 H14 A6,6 0 0 1 8,32 V14 A6,6 0 0 1 14,8 Z" fill="#FFF7EA" stroke="#111111" stroke-width="2.4"/>
      <path d="M16,14.5 H30 A2,2 0 0 1 32,16.5 V26.5 A2,2 0 0 1 30,28.5 H16 A2,2 0 0 1 14,26.5 V16.5 A2,2 0 0 1 16,14.5 Z" fill="none" stroke="#111111" stroke-width="2.3"/>
      <path d="M16.8,26 L20.8,20.6 L23.9,24.3 L25.9,22.2 L29.2,26 Z" fill="#111111"/>
      <circle cx="27.4" cy="18.6" r="1.7" fill="#FF5A1F"/>
      <path d="M19.5,33 H26.5" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <text class="name" x="53" y="32.5">IMMICH CAST</text>
  </g>
</svg>
</body>
</html>
