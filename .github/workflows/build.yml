name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag v<versionName>) with the APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IMMICH_CAST_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "IMMICH_CAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          IMMICH_CAST_KEYSTORE_PASSWORD: ${{ secrets.IMMICH_CAST_KEYSTORE_PASSWORD }}
          IMMICH_CAST_KEY_ALIAS: ${{ secrets.IMMICH_CAST_KEY_ALIAS }}
          IMMICH_CAST_KEY_PASSWORD: ${{ secrets.IMMICH_CAST_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Rename APK
        run: |
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "immich-cast-${version}.apk"
          echo "APK=immich-cast-${version}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: immich-cast-apk
          path: ${{ env.APK }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports

      # Runs for a pushed v* tag, or from "Run workflow" with "release" ticked
      # (which creates the v<versionName> tag on the commit that was built).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Immich Cast ${{ env.VERSION }}
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            ## Install

            Download **${{ env.APK }}** below, then follow the step-by-step guide:
            [INSTALL.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/INSTALL.md)

            Already installed? Update in place, keeping your settings:
            `adb install -r ${{ env.APK }}`
